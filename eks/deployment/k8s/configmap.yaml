apiVersion: v1
kind: ConfigMap
metadata:
  name: noke-mcp-config
  namespace: noke-mcp
data:
  # ── Database (non-secret connection params) ───────────────────────────────
  DB_HOST:              "noke-mysql-cluster.cluster-cmftlirsxmms.us-east-2.rds.amazonaws.com"
  DB_PORT:              "3306"
  DB_USER:              "pradesh_kumar"
  DB_SCHEMA:            "smartentry-main"

  # ── DB column / table config ──────────────────────────────────────────────
  USERS_ACTIVE_COL:     "state"
  USERS_ACTIVE_VALUE:   "active"
  USERS_ROLES_SITE_COL: "site_id"

  # ── MCP server public URL ─────────────────────────────────────────────────
  MCP_BASE_URL:         "https://mcp.smartentry.noke.dev"

# ── SECRETS — stored in Kubernetes Secret noke-mcp-secrets ───────────────────
#   DB_PASSWORD      — RDS database password
#   NOKE_JWT_SECRET  — NOKE JWT signing secret (from Go backend auth.go)
#   MCP_API_KEY      — Shared API key for POST /api/query
# ─────────────────────────────────────────────────────────────────────────────