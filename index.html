<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Noke Smart Entry — MCP Local Test</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      margin: 0;
      padding: 24px;
      color: #1a1a2e;
    }

    .card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      padding: 28px 32px;
      max-width: 900px;
      margin: 0 auto 24px;
    }

    h1 { margin: 0 0 4px; font-size: 1.5rem; color: #0d1b4b; }
    .subtitle { color: #666; font-size: 0.92rem; margin-bottom: 24px; }
    .badge {
      display: inline-block;
      background: #e8f0fe;
      color: #1a73e8;
      border-radius: 20px;
      padding: 2px 12px;
      font-size: 0.82rem;
      font-weight: 600;
      margin-left: 8px;
    }

    label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 0.9rem; color: #333; }

    .form-grid {
      display: grid;
      grid-template-columns: 160px 220px 140px 1fr;
      gap: 16px;
      align-items: end;
    }

    input, select {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus { border-color: #1a73e8; }

    button {
      padding: 10px 24px;
      background: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }
    button:hover { background: #1558b0; }
    button:disabled { background: #9aa0a6; cursor: not-allowed; }

    .table-label-row {
      display: none;
      margin-top: 12px;
    }

    #status {
      margin-top: 16px;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 0.88rem;
      display: none;
    }
    #status.info  { background: #e8f0fe; color: #1a73e8; display: block; }
    #status.error { background: #fde8e8; color: #c5221f; display: block; }
    #status.ok    { background: #e6f4ea; color: #137333; display: block; }

    .meta-bar {
      display: flex;
      gap: 16px;
      font-size: 0.82rem;
      color: #777;
      margin-top: 12px;
      margin-bottom: 8px;
    }
    .meta-bar span strong { color: #333; }

    .table-wrap {
      overflow-x: auto;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.84rem;
    }
    th {
      background: #f8f9fa;
      padding: 9px 12px;
      text-align: left;
      font-weight: 600;
      color: #374151;
      border-bottom: 1px solid #e5e7eb;
      white-space: nowrap;
    }
    td {
      padding: 8px 12px;
      border-bottom: 1px solid #f3f4f6;
      color: #374151;
      max-width: 280px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f9fafb; }

    .empty { text-align: center; padding: 32px; color: #9aa0a6; font-size: 0.9rem; }
  </style>
</head>
<body>

<div class="card">
  <h1>Noke Smart Entry <span class="badge">MCP Local Test</span></h1>
  <div class="subtitle">
    Server: <strong>http://localhost:8000</strong> &nbsp;|&nbsp;
    Authorization: per-user site assignment (users &rarr; users_roles)
  </div>

  <div class="form-grid">
    <div>
      <label for="userId">User ID</label>
      <input id="userId" type="number" placeholder="e.g. 1" min="1" />
    </div>
    <div>
      <label for="tool">Tool</label>
      <select id="tool" onchange="onToolChange()">
        <option value="get_units">get_units</option>
        <option value="get_locks">get_locks</option>
        <option value="get_locks_to_units">get_locks_to_units</option>
        <option value="describe_table">describe_table</option>
      </select>
    </div>
    <div>
      <label for="limit">Row Limit</label>
      <input id="limit" type="number" value="100" min="1" max="1000" />
    </div>
    <div style="display:flex;align-items:flex-end;">
      <button id="runBtn" onclick="runQuery()">Run Query</button>
    </div>
  </div>

  <div class="table-label-row" id="tableRow">
    <label for="tableName">Table Name (for describe_table)</label>
    <select id="tableName">
      <option value="v2_units">v2_units</option>
      <option value="v2_locks">v2_locks</option>
      <option value="v2_locks_to_units">v2_locks_to_units</option>
      <option value="users">users</option>
      <option value="users_roles">users_roles</option>
    </select>
  </div>

  <div id="status"></div>
</div>

<div class="card" id="resultsCard" style="display:none;">
  <div class="meta-bar">
    <span>Tool: <strong id="metaTool">—</strong></span>
    <span>User ID: <strong id="metaUser">—</strong></span>
    <span>Rows returned: <strong id="metaCount">—</strong></span>
  </div>
  <div class="table-wrap">
    <div id="results"></div>
  </div>
</div>

<script>
  const API = 'http://localhost:8000/api/query';

  function onToolChange() {
    const tool = document.getElementById('tool').value;
    const tableRow = document.getElementById('tableRow');
    const limitInput = document.getElementById('limit');
    tableRow.style.display = tool === 'describe_table' ? 'block' : 'none';
    limitInput.disabled = tool === 'describe_table';
  }

  function setStatus(msg, type) {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = type;
  }

  function clearStatus() {
    const el = document.getElementById('status');
    el.className = '';
    el.textContent = '';
  }

  async function runQuery() {
    clearStatus();
    const userIdRaw = document.getElementById('userId').value.trim();
    const tool = document.getElementById('tool').value;
    const limit = parseInt(document.getElementById('limit').value, 10) || 100;
    const tableName = document.getElementById('tableName').value;

    if (!userIdRaw || isNaN(parseInt(userIdRaw, 10))) {
      setStatus('Please enter a valid numeric User ID.', 'error');
      return;
    }

    const body = { user_id: parseInt(userIdRaw, 10), tool, limit };
    if (tool === 'describe_table') body.table = tableName;

    const btn = document.getElementById('runBtn');
    btn.disabled = true;
    setStatus('Sending request…', 'info');

    try {
      const res = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });

      const json = await res.json();

      if (!res.ok) {
        setStatus(`Error ${res.status}: ${json.detail || JSON.stringify(json)}`, 'error');
        document.getElementById('resultsCard').style.display = 'none';
        return;
      }

      setStatus(`✓ Query completed — ${json.row_count} row(s) returned.`, 'ok');
      renderResults(json);
    } catch (err) {
      setStatus(`Failed to reach server: ${err.message}. Is the server running on port 8000?`, 'error');
      document.getElementById('resultsCard').style.display = 'none';
    } finally {
      btn.disabled = false;
    }
  }

  function renderResults(json) {
    document.getElementById('metaTool').textContent = json.tool;
    document.getElementById('metaUser').textContent = json.user_id ?? '—';
    document.getElementById('metaCount').textContent = json.row_count;
    document.getElementById('resultsCard').style.display = 'block';

    const container = document.getElementById('results');

    if (!json.data || json.data.length === 0) {
      container.innerHTML = '<div class="empty">No rows returned.</div>';
      return;
    }

    const cols = Object.keys(json.data[0]);
    let html = '<table><thead><tr>';
    cols.forEach(c => { html += `<th>${escHtml(c)}</th>`; });
    html += '</tr></thead><tbody>';

    json.data.forEach(row => {
      html += '<tr>';
      cols.forEach(c => {
        const val = row[c] == null ? '<em style="color:#aaa">null</em>' : escHtml(String(row[c]));
        html += `<td title="${escHtml(String(row[c] ?? ''))}">${val}</td>`;
      });
      html += '</tr>';
    });

    html += '</tbody></table>';
    container.innerHTML = html;
  }

  function escHtml(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
</script>
</body>
</html>
