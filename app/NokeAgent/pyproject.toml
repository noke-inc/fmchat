[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
name             = "NokeAgent"
version          = "0.1.0"
description      = "Noke Smart Entry LangGraph agent — AWS Bedrock AgentCore deployment"
requires-python  = ">=3.11"

dependencies = [
    # AgentCore Runtime SDK
    "bedrock-agentcore>=1.0.3",

    # OpenTelemetry (required by AgentCore for observability)
    "aws-opentelemetry-distro",
    "opentelemetry-instrumentation-langchain>=0.59.0",

    # LangGraph + LangChain
    "langgraph>=1.2.4",
    "langgraph-prebuilt>=1.1.0",
    "langchain>=0.3.0",
    "langchain-aws>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-mcp-adapters>=0.1.0",
    "mcp>=1.19.0",

    # AWS SDK
    "botocore[crt]>=1.35.0",
    "boto3>=1.34.0",
    "httpx>=0.27.0",

    # Pydantic (pinned — fastmcp 2.5.2 requires <2.12)
    "pydantic==2.11.7",
    "pydantic-core==2.33.2",

    # Utilities
    "python-dotenv>=1.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

