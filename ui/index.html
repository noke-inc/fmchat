<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Entry AI</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="backdrop"></div>

  <button id="chat-launcher" aria-label="Open chat" title="Open chat">
    <span>Ask AI</span>
  </button>

  <section id="chat-panel" aria-live="polite" aria-label="AI Chat panel" class="hidden">

    <!-- Top header: title + close button -->
    <header class="chat-header">
      <div>
        <h1>Smart Entry AI</h1>
        <p id="header-subtitle">Select a site to begin</p>
      </div>
      <button id="chat-close" aria-label="Close chat">✕</button>
    </header>

    <!-- Site name bar — shown after site is selected -->
    <div id="site-header" class="site-header hidden">
      <span id="site-header-name">📍</span>
      <button id="clear-session-btn">Clear Session</button>
    </div>

    <!-- Chat message log -->
    <main id="chat-log" class="chat-log"></main>

    <!-- Site picker — shown before site is selected -->
    <div id="site-picker" class="site-picker">
      <p class="site-picker-label">Choose your site to get started:</p>
      <div id="site-buttons" class="site-buttons">
        <span class="site-loading">Loading sites…</span>
      </div>
    </div>

    <!-- Chat input form — disabled until site is selected -->
    <form id="chat-form" class="chat-form">
      <textarea id="chat-input" placeholder="Type your message…" rows="2" disabled></textarea>
      <button id="send-btn" type="submit" disabled>Send</button>
    </form>

  </section>

  <script src="app.js?v=20260721-2"></script>
</body>
</html>
